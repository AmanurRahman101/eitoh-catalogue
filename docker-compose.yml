version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: eitoh_secure_password
      MYSQL_DATABASE: eitoh_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  app:
    build: .
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: eitoh_secure_password
      DB_NAME: eitoh_db
      JWT_SECRET: eitoh_production_jwt_secret_key_change_me
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npm run migrate && npm start"

volumes:
  mysql_data:
